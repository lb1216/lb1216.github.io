{% include base_path %}
<header class="site-header">
  <div class="site-header__title">
    <a href="{{ base_path }}/">{{ site.title }}</a>
  </div>
  <nav id="primary-nav" class="site-header__nav" aria-label="Main">
    <ul>
      <li class="masthead__menu-item {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
        <a href="{{ base_path }}/">Home</a>
      </li>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
          <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</header>
